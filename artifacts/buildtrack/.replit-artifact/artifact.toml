kind = "web"
previewPath = "/"
title = "BuildTrack – Construction Expense Manager"
version = "1.0.0"
id = "artifacts/buildtrack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22338
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/buildtrack run dev"

[services.env]
PORT = "22338"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/buildtrack", "run", "build"]
publicDir = "artifacts/buildtrack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

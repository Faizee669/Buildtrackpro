<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- Simple Shell Suppression Logic: Login pages don't usually show full nav -->
<main class="flex-grow flex items-center justify-center px-6 py-xxl">
<div class="w-full max-w-[440px]">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-lg">
<div class="mb-sm flex items-center gap-base">
<span class="material-symbols-outlined text-[#E8612D] text-4xl" data-icon="architecture">architecture</span>
<h1 class="text-xl font-black text-[#E8612D] tracking-tighter font-display">BuildTrack Pro+</h1>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg login-card">
<div class="mb-lg">
<h2 class="font-h2 text-h2 text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-sm text-body-sm text-secondary">Log in to manage your construction projects.</p>
</div>
<form action="#" class="space-y-sm">
<!-- Email Field -->
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative group">
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all outline-none text-body-md font-body-md" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all outline-none text-body-md font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-xs py-base">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-secondary cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<!-- Login Button -->
<button class="w-full bg-[#E8612D] text-white font-h3 text-body-md py-sm rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs" type="submit">
                        Login to Dashboard
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-label-caps">
<span class="bg-surface-container-lowest px-sm text-secondary uppercase tracking-widest font-label-caps">Enterprise Access</span>
</div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-1 gap-sm">
<button class="flex items-center justify-center gap-xs w-full py-sm px-md border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors font-body-sm text-secondary">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google company logo icon with four colors on a white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxuZnKjlm9GiL19nKXi3LyEYUBraJSVLCxBOy_Iu4dNq2TwCaaWTW6PnwkF97og_z1X6xbY_f1FPKB57_CWH7M40eGhXNBh35WiwrsHJKb-4ZLiWhup5JXFUxejvLjsRkiitDSUm68WryxA9mLXybrmQuN397Hhgdp7LchiZm7rq7Rzzf0J7LSl-g4SQttS_iQFAst5wfdyX5hYmL9w_4PbQgl7GzHMd-NI7kot6HpRWycaZJteC0lxjJqAD4PNpiXb83wa2EVTTfR"/>
                        Continue with Google
                    </button>
</div>
</div>
<!-- Signup Footer -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Request a demo</a> or 
                    <a class="text-primary font-semibold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Structural Footer Component from JSON -->
<footer class="w-full py-12 border-t border-slate-200 dark:border-slate-800 bg-[#F9FAFB] dark:bg-slate-950">
<div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
<div class="text-lg font-bold text-slate-900 dark:text-white font-display">BuildTrack Pro+</div>
<div class="flex flex-wrap justify-center gap-md font-body-sm text-slate-500 dark:text-slate-400">
<a class="hover:text-[#E8612D] transition-colors transition-all duration-200" href="#">Privacy Policy</a>
<a class="hover:text-[#E8612D] transition-colors transition-all duration-200" href="#">Terms of Service</a>
<a class="hover:text-[#E8612D] transition-colors transition-all duration-200" href="#">Contact Support</a>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400 font-body-sm">© 2024 BuildTrack Pro+. All rights reserved.</p>
</div>
</footer>

</div>
</body></html>
